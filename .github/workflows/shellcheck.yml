name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - '.githooks/**'
      - 'templates/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'bin/**'
      - '.githooks/**'
      - 'templates/**/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bin/*.sh
        run: shellcheck -x bin/*.sh
      - name: Lint .githooks/*
        run: shellcheck -x .githooks/pre-commit
      - name: Lint templates/**/*.sh
        run: |
          if compgen -G 'templates/**/*.sh' > /dev/null; then
            find templates -name '*.sh' -print0 | xargs -0 shellcheck -x
          fi
